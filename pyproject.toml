[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg"
version = "0.1.0"
description = "Remote heart rate from a webcam with the POS algorithm"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.9",
    "numpy>=1.26",         
    "scipy>=1.11",
    "pyyaml>=6",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]